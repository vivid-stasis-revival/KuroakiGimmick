[package]
name = "kg_native_core"
version = "0.3.0-alpha.0"
edition = "2021"
license = "MPL-2.0"
description = "Kuroaki/Gimmick Optimization Engine: native chart, audio and note motion"

[dependencies]
symphonia = { version = "=0.5.4", default-features = false, features = ["ogg", "vorbis", "flac", "wav", "pcm", "mp3", "isomp4", "aac"] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
