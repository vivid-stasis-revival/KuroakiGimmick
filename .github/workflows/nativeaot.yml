name: NativeAOT builds

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect build / release intent
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      is_release: ${{ steps.meta.outputs.is_release }}
      build_label: ${{ steps.meta.outputs.build_label }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve changed files and release metadata
        shell: bash
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=7 HEAD)"
          message="$(git log -1 --pretty=%B)"
          release_line="$(printf '%s\n' "$message" | grep -Eom1 'release: v[0-9]+\.[0-9]+\.[0-9]+ / [0-9]+(\.[0-9]+)*' || true)"

          is_release=false
          build_label="Nightly / ${short_sha}"
          release_tag="nightly-${short_sha}"

          if [[ -n "$release_line" ]]; then
            is_release=true
            build_label="${release_line#release: }"

            # Git refs cannot contain spaces or slashes in this form.
            # Keep the human-readable slash form only as the Release title.
            release_tag="$(printf '%s' "$build_label" \
              | sed -E 's# / #-#g; s#[^0-9A-Za-z._-]+#-#g; s#-+$##')"
          fi

          should_build=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual run always builds the selected commit.
            should_build=true
          elif [[ "$is_release" == true ]]; then
            # Stable releases always rebuild from the triggering commit,
            # even when the release commit only changes metadata/docs.
            should_build=true
          else
            before="${{ github.event.before }}"

            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              changed="$(git show --pretty='' --name-only HEAD)"
            else
              changed="$(git diff --name-only "$before" "${GITHUB_SHA}")"
            fi

            echo "Changed files:"
            printf '%s\n' "$changed"

            # Only application/build inputs trigger NativeAOT.
            # README / CHANGELOG / .github-only commits intentionally do not build.
            if printf '%s\n' "$changed" | grep -Eq \
              '^(src/|Assets/|Resources/|ThirdParty/|scripts/|KuroakiGimmick\.csproj$|packages\.lock\.json$|app\.manifest$)'; then
              should_build=true
            fi
          fi

          {
            echo "short_sha=$short_sha"
            echo "is_release=$is_release"
            echo "should_build=$should_build"
            echo "build_label=$build_label"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

          echo "should_build=$should_build"
          echo "is_release=$is_release"
          echo "build_label=$build_label"
          echo "release_tag=$release_tag"

  build:
    name: ${{ matrix.rid }}
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            rid: win-x64
            executable: KuroakiGimmick.exe
            sdl: SDL3.dll
            shaderc: shaderc_shared.dll
            spirv_cross: spirv-cross.dll

          - runner: macos-15
            rid: osx-arm64
            executable: KuroakiGimmick
            sdl: libSDL3.dylib
            shaderc: libshaderc_shared.dylib
            spirv_cross: libspirv-cross.dylib

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: '8.0.x'

      - name: Select the installed SDK
        shell: bash
        run: |
          printf '{"sdk":{"version":"%s"}}\n' \
            '${{ steps.dotnet.outputs.dotnet-version }}' > global.json

      - name: Publish NativeAOT
        shell: bash
        env:
          BUILD_LABEL: ${{ needs.detect.outputs.build_label }}
        run: |
          set -euo pipefail

          dotnet publish KuroakiGimmick.csproj \
            -c Release \
            -r '${{ matrix.rid }}' \
            --self-contained true \
            -p:PublishAot=true \
            -p:PublishSingleFile=false \
            "-p:InformationalVersion=${BUILD_LABEL}" \
            -o 'artifacts/${{ matrix.rid }}'

      - name: Verify native output and embedded version
        shell: bash
        env:
          BUILD_LABEL: ${{ needs.detect.outputs.build_label }}
        run: |
          set -euo pipefail

          test -f 'artifacts/${{ matrix.rid }}/${{ matrix.executable }}'
          test -f 'artifacts/${{ matrix.rid }}/${{ matrix.sdl }}'
          test -f 'artifacts/${{ matrix.rid }}/${{ matrix.shaderc }}'
          test -f 'artifacts/${{ matrix.rid }}/${{ matrix.spirv_cross }}'

          test ! -f 'artifacts/${{ matrix.rid }}/KuroakiGimmick.runtimeconfig.json'
          test ! -f 'artifacts/${{ matrix.rid }}/KuroakiGimmick.deps.json'

          actual="$('artifacts/${{ matrix.rid }}/${{ matrix.executable }}' --version | sed 's/^KuroakiGimmick //')"

          if [[ "$actual" != "$BUILD_LABEL" ]]; then
            echo "Version mismatch: '$actual' != '$BUILD_LABEL'" >&2
            exit 1
          fi

      - name: Archive macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --keepParent \
            'artifacts/${{ matrix.rid }}' \
            'artifacts/KuroakiGimmick-${{ matrix.rid }}.zip'

      - name: Archive Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -LiteralPath 'artifacts/${{ matrix.rid }}' `
            -DestinationPath 'artifacts/KuroakiGimmick-${{ matrix.rid }}.zip'

      # archive: false makes upload-artifact use the uploaded filename itself
      # as the Actions artifact name, so do not set a misleading custom name.
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/KuroakiGimmick-${{ matrix.rid }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [detect, build]
    if: needs.detect.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # With archive:false above, the real Actions artifact names are:
      #   KuroakiGimmick-win-x64.zip
      #   KuroakiGimmick-osx-arm64.zip
      - name: Download release archives
        uses: actions/download-artifact@v7
        with:
          pattern: 'KuroakiGimmick-*.zip'
          path: release-assets
          merge-multiple: true

      - name: Verify downloaded release archives
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloaded release assets:"
          find release-assets -type f -print | sort

          test -f release-assets/KuroakiGimmick-win-x64.zip
          test -f release-assets/KuroakiGimmick-osx-arm64.zip

      - name: Publish Nightly or stable Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_LABEL: ${{ needs.detect.outputs.build_label }}
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          IS_RELEASE: ${{ needs.detect.outputs.is_release }}
          SHORT_SHA: ${{ needs.detect.outputs.short_sha }}

        run: |
          set -euo pipefail

          mapfile -t assets < <(
            find release-assets -type f -name 'KuroakiGimmick-*.zip' -print | sort
          )

          if (( ${#assets[@]} != 2 )); then
            echo "Expected exactly 2 release archives, found ${#assets[@]}." >&2
            printf 'Found: %s\n' "${assets[@]:-<none>}" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload \
              "$RELEASE_TAG" \
              "${assets[@]}" \
              --clobber

            if [[ "$IS_RELEASE" == true ]]; then
              gh release edit \
                "$RELEASE_TAG" \
                --title "$BUILD_LABEL" \
                --draft=false \
                --prerelease=false
            else
              gh release edit \
                "$RELEASE_TAG" \
                --title "$BUILD_LABEL" \
                --draft=false \
                --prerelease=true
            fi

          elif [[ "$IS_RELEASE" == true ]]; then
            gh release create \
              "$RELEASE_TAG" \
              "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$BUILD_LABEL" \
              --generate-notes

          else
            gh release create \
              "$RELEASE_TAG" \
              "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$BUILD_LABEL" \
              --prerelease \
              --notes "Automated NativeAOT build for commit ${SHORT_SHA} (${GITHUB_SHA})."
          fi
