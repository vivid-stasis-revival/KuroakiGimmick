name: Cross-platform builds

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect build / release intent
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      is_release: ${{ steps.meta.outputs.is_release }}
      build_label: ${{ steps.meta.outputs.build_label }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve changed files and release metadata
        shell: bash
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=7 HEAD)"
          message="$(git log -1 --pretty=%B)"
          release_line="$(printf '%s\n' "$message" | grep -Eom1 'release: v[0-9]+\.[0-9]+\.[0-9]+ / [0-9]+(\.[0-9]+)*' || true)"

          is_release=false
          build_label="Nightly / ${short_sha}"
          release_tag="nightly-${short_sha}"

          if [[ -n "$release_line" ]]; then
            is_release=true
            build_label="${release_line#release: }"

            # Git refs cannot contain spaces or slashes in this form.
            # Keep the human-readable slash form only as the Release title.
            release_tag="$(printf '%s' "$build_label" \
              | sed -E 's# / #-#g; s#[^0-9A-Za-z._-]+#-#g; s#-+$##')"
          fi

          should_build=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual runs always build the selected commit.
            should_build=true
          elif [[ "$is_release" == true ]]; then
            # Stable releases always rebuild from the triggering commit,
            # even when the release commit only changes metadata/docs.
            should_build=true
          else
            before="${{ github.event.before }}"

            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              changed="$(git show --pretty='' --name-only HEAD)"
            else
              changed="$(git diff --name-only "$before" "${GITHUB_SHA}")"
            fi

            echo "Changed files:"
            printf '%s\n' "$changed"

            # Only application/build inputs trigger NativeAOT.
            # README / CHANGELOG-only commits intentionally do not build. Rust and release workflow changes do.
            if printf '%s\n' "$changed" | grep -Eq \
              '^(src/|platform/|rust/|Assets/|Resources/|ThirdParty/|scripts/|\.github/workflows/nativeaot\.yml$|KuroakiGimmick\.csproj$|packages\.lock\.json$|app\.manifest$)'; then
              should_build=true
            fi
          fi

          {
            echo "short_sha=$short_sha"
            echo "is_release=$is_release"
            echo "should_build=$should_build"
            echo "build_label=$build_label"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

          echo "should_build=$should_build"
          echo "is_release=$is_release"
          echo "build_label=$build_label"
          echo "release_tag=$release_tag"

  build:
    name: ${{ matrix.rid }}
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            rid: win-x64
            executable: KuroakiGimmick.exe
            sdl: SDL3.dll
            shaderc: shaderc_shared.dll
            spirv_cross: spirv-cross.dll
            rust_core: kg_native_core.dll

          - runner: macos-15
            rid: osx-arm64
            executable: KuroakiGimmick
            sdl: libSDL3.dylib
            shaderc: libshaderc_shared.dylib
            spirv_cross: libspirv-cross.dylib
            rust_core: libkg_native_core.dylib

          - runner: ubuntu-24.04
            rid: linux-x64
            executable: KuroakiGimmick
            sdl: libSDL3.so
            shaderc: libshaderc_shared.so
            spirv_cross: libspirv-cross.so
            rust_core: libkg_native_core.so

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libx11-6 libxext6 libwayland-client0 libvulkan1 zip

      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: '8.0.x'

      - name: Select the installed SDK
        shell: bash
        run: |
          printf '{"sdk":{"version":"%s"}}\n' \
            '${{ steps.dotnet.outputs.dotnet-version }}' > global.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust Optimization Engine unit tests
        shell: bash
        run: cargo test --manifest-path rust/kg-native-core/Cargo.toml

      - name: Publish NativeAOT
        shell: bash
        env:
          BUILD_LABEL: ${{ needs.detect.outputs.build_label }}
        run: |
          set -euo pipefail

          dotnet publish KuroakiGimmick.csproj \
            -c Release \
            -r '${{ matrix.rid }}' \
            --self-contained true \
            -p:KuroakiExternalAssets=true \
            -p:PublishAot=true \
            -p:PublishSingleFile=false \
            "-p:InformationalVersion=${BUILD_LABEL}" \
            -o 'artifacts/${{ matrix.rid }}'

      - name: Build and stage matching Rust Optimization Engine
        shell: bash
        run: |
          set -euo pipefail
          source scripts/rust-native-common.sh
          kg_rust_publish '${{ matrix.rid }}' 'artifacts/${{ matrix.rid }}'

      - name: Include package readme and dependency notices
        shell: bash
        run: |
          set -euo pipefail
          output='artifacts/${{ matrix.rid }}'
          cp README.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$output/"
          cp docs/EXTERNAL_ASSETS.md "$output/INSTALL-ASSETS.md"
          cp -R ThirdParty "$output/"
          test ! -d "$output/docs"
          test ! -d "$output/tests"

      - name: Verify native output and embedded version
        shell: bash
        env:
          BUILD_LABEL: ${{ needs.detect.outputs.build_label }}
        run: |
          set -euo pipefail

          test -f 'artifacts/${{ matrix.rid }}/${{ matrix.executable }}'
          test -f 'artifacts/${{ matrix.rid }}/${{ matrix.sdl }}'
          test -f 'artifacts/${{ matrix.rid }}/${{ matrix.shaderc }}'
          test -f 'artifacts/${{ matrix.rid }}/${{ matrix.spirv_cross }}'
          test -s 'artifacts/${{ matrix.rid }}/${{ matrix.rust_core }}'

          test ! -f 'artifacts/${{ matrix.rid }}/KuroakiGimmick.runtimeconfig.json'
          test ! -f 'artifacts/${{ matrix.rid }}/KuroakiGimmick.deps.json'

          actual="$(
            'artifacts/${{ matrix.rid }}/${{ matrix.executable }}' --version \
              | sed 's/^KuroakiGimmick //'
          )"

          if [[ "$actual" != "$BUILD_LABEL" ]]; then
            echo "Version mismatch: '$actual' != '$BUILD_LABEL'" >&2
            exit 1
          fi

      - name: Verify reference Markdown in the actual published executable
        shell: bash
        run: |
          set -euo pipefail
          'artifacts/${{ matrix.rid }}/${{ matrix.executable }}' --reference-layout-test

      - name: Verify RustBridge in the actual published executable
        shell: bash
        run: |
          set -euo pipefail
          executable='artifacts/${{ matrix.rid }}/${{ matrix.executable }}'
          KG_RUST_BRIDGE=verify "$executable" --rust-bridge-test
          KG_RUST_ENGINE=verify "$executable" --rust-engine-test
          KG_RUST_ENGINE=verify "$executable" --rust-timeline-test
          KG_RUST_AUDIO_REQUIRED=1 "$executable" --rust-audio-test

      - name: Record packaged Rust Engine files
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### NativeAOT package: ${{ matrix.rid }}'
            echo 'Rust Engine is shipped beside the native executable:'
            echo '- `${{ matrix.executable }}`'
            echo '- `${{ matrix.rust_core }}`'
            echo 'All four native load/parity tests passed on the published executable.'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh 'artifacts/${{ matrix.rid }}/${{ matrix.rust_core }}'

      - name: Archive macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --keepParent \
            'artifacts/${{ matrix.rid }}' \
            'artifacts/KuroakiGimmick-${{ matrix.rid }}.zip'

      - name: Archive Linux build
        if: runner.os == 'Linux'
        run: cd artifacts && zip -r 'KuroakiGimmick-${{ matrix.rid }}.zip' '${{ matrix.rid }}'

      - name: Archive Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -LiteralPath 'artifacts/${{ matrix.rid }}' `
            -DestinationPath 'artifacts/KuroakiGimmick-${{ matrix.rid }}.zip'

      # Keep the release .zip INSIDE a normal Actions artifact wrapper.
      # download-artifact extracts only this outer wrapper, leaving the
      # KuroakiGimmick-*.zip release archive intact for gh release upload.
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: nativeaot-${{ matrix.rid }}
          path: artifacts/KuroakiGimmick-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  mobile:
    name: ${{ matrix.platform }}
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: ios
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.101
      - name: Select pinned mobile SDK
        shell: bash
        run: printf '{"sdk":{"version":"10.0.101","rollForward":"disable"}}\n' > global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select iOS toolchain
        if: matrix.platform == 'ios'
        run: |
          test -d /Applications/Xcode_26.2.app
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          brew install ninja
      - name: Install Android native build tools
        if: matrix.platform == 'android'
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake libgl1
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        if: matrix.platform == 'android'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Install only required mobile workload
        shell: bash
        run: dotnet workload install '${{ matrix.platform }}' --version 10.0.101.1
      - name: Prepare Android signing key
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/ci/prepare_android_signing.py
      - name: Build signed Android APK
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python platform/mobile/build.py android --external-assets --output artifacts/android
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/android/*.apk
      - name: Build unsigned iOS IPA
        if: matrix.platform == 'ios'
        run: python platform/mobile/build.py ios --external-assets --output artifacts/ios
      - name: Remove temporary Android signing key
        if: always() && matrix.platform == 'android'
        run: python -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "kuroaki-signing.jks").unlink(missing_ok=True)'
      - name: Archive mobile program
        shell: bash
        run: |
          cp docs/EXTERNAL_ASSETS.md artifacts/${{ matrix.platform }}/INSTALL-ASSETS.md
          cd artifacts
          zip -r KuroakiGimmick-${{ matrix.platform }}.zip ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: nativeaot-${{ matrix.platform }}
          path: artifacts/KuroakiGimmick-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  switch-status:
    needs: detect
    if: needs.detect.outputs.should_build == 'true' && vars.KG_SWITCH_RUNNER_READY != 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Switch NRO pending — provide the full Linux x64 toolchain and configure the isolated kg-switch runner. No NRO was built.' >> "$GITHUB_STEP_SUMMARY"

  switch:
    name: Switch NRO
    needs: detect
    if: needs.detect.outputs.should_build == 'true' && vars.KG_SWITCH_RUNNER_READY == 'true'
    runs-on: [self-hosted, Linux, X64, kg-switch]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Build current source with prepared toolchain
        env:
          KG_SWITCH_TOOLCHAIN_ROOT: ${{ vars.KG_SWITCH_TOOLCHAIN_ROOT }}
        run: bash scripts/ci/build_switch.sh
      - uses: actions/upload-artifact@v7
        with:
          name: nativeaot-switch
          path: artifacts/KuroakiGimmick-switch.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: [detect, build, mobile, switch]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.detect.outputs.should_build == 'true' && needs.build.result == 'success' && needs.mobile.result == 'success' && needs.switch.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v7
        with:
          pattern: 'nativeaot-*'
          path: release-assets
          merge-multiple: true

      - name: Verify downloaded release archives
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloaded release assets:"
          find release-assets -maxdepth 1 -type f -print | sort

          test -f release-assets/KuroakiGimmick-win-x64.zip
          test -f release-assets/KuroakiGimmick-osx-arm64.zip
          test -f release-assets/KuroakiGimmick-linux-x64.zip
          test -f release-assets/KuroakiGimmick-android.zip
          test -f release-assets/KuroakiGimmick-ios.zip
          test -f release-assets/KuroakiGimmick-switch.zip

          mapfile -t assets < <(
            find release-assets -maxdepth 1 -type f -name 'KuroakiGimmick-*.zip' -print | sort
          )

          if (( ${#assets[@]} != 6 )); then
            echo "Expected exactly 6 release archives, found ${#assets[@]}." >&2
            printf 'Found: %s\n' "${assets[@]:-<none>}" >&2
            exit 1
          fi

      - name: Publish Nightly or stable Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_LABEL: ${{ needs.detect.outputs.build_label }}
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          IS_RELEASE: ${{ needs.detect.outputs.is_release }}
          SHORT_SHA: ${{ needs.detect.outputs.short_sha }}

        run: |
          set -euo pipefail

          mapfile -t assets < <(
            find release-assets -maxdepth 1 -type f -name 'KuroakiGimmick-*.zip' -print | sort
          )

          if (( ${#assets[@]} != 6 )); then
            echo "Expected exactly 6 release archives, found ${#assets[@]}." >&2
            printf 'Found: %s\n' "${assets[@]:-<none>}" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A corrective release commit can reuse the same version. Keep the tag
            # pointing at the code that produced the uploaded native artifacts.
            tagged_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              if [[ "$IS_RELEASE" != true ]]; then
                echo "Refusing to move non-release tag $RELEASE_TAG" >&2
                exit 1
              fi
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
              echo "Updated corrective release tag $RELEASE_TAG to $GITHUB_SHA"
            fi
            gh release upload \
              "$RELEASE_TAG" \
              "${assets[@]}" \
              --clobber

            if [[ "$IS_RELEASE" == true ]]; then
              gh release edit \
                "$RELEASE_TAG" \
                --title "$BUILD_LABEL" \
                --draft=false \
                --prerelease=false
            else
              gh release edit \
                "$RELEASE_TAG" \
                --title "$BUILD_LABEL" \
                --draft=false \
                --prerelease=true
            fi

          elif [[ "$IS_RELEASE" == true ]]; then
            gh release create \
              "$RELEASE_TAG" \
              "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$BUILD_LABEL" \
              --generate-notes

          else
            gh release create \
              "$RELEASE_TAG" \
              "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$BUILD_LABEL" \
              --prerelease \
              --notes "Automated NativeAOT build for commit ${SHORT_SHA} (${GITHUB_SHA})."
          fi
